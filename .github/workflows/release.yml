name: Build & Release

# Trigger:
#  - push of a version tag (vX.Y.Z) creates a real GitHub Release with the .exe asset.
#  - manual run (workflow_dispatch) is allowed for testing.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # required to create the release

jobs:
  build-release:
    name: Build single-file self-contained Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore SSForensic/SSForensic.csproj

      - name: Publish single-file self-contained x64
        run: >
          dotnet publish SSForensic/SSForensic.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o publish

      - name: Determine version
        id: ver
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $tag.StartsWith("v")) { $tag = "v0.0.0-dev" }
          echo "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Stage the .exe asset
        shell: pwsh
        run: |
          $exe = "publish\SSForensic.exe"
          if (-not (Test-Path $exe)) { throw "SSForensic.exe not found in publish output" }
          $ver = "${{ steps.ver.outputs.tag }}".TrimStart('v')
          $asset = "ReplaceParser.$ver.exe"
          Copy-Item $exe $asset
          echo "ASSET=$asset" >> $env:GITHUB_ENV

      - name: Create / Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Replace Parser ${{ github.ref_name }}
          generate_release_notes: true
          files: ${{ env.ASSET }}

      - name: Upload artifact (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: ReplaceParser-${{ steps.ver.outputs.tag }}
          path: ${{ env.ASSET }}
